[project]
name = "heirloom"
version = "0.1.0"
description = "Heirloom tells you why code is the way it is, who still understands it, and what breaks if you change it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "GitPython>=3.1",
    "rapidfuzz>=3.6",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "fastmcp>=2.0",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
watsonx = ["ibm-watsonx-ai>=1.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
]

[project.scripts]
heirloom = "cli.main:app_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["core*", "api*", "cli*", "mcp_server*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["core"]
